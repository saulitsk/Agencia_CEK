<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Fundo azul-marinho com cantos arredondados -->
  <rect width="64" height="64" rx="14" fill="#12205C"/>
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="#F4B93E" stroke-opacity="0.3" stroke-width="1.5"/>

  <!-- Ônibus estilizado em dourado vibrante e branco -->
  <g transform="translate(14, 12)">
    <!-- Teto e corpo do ônibus -->
    <path d="M4 3 C4 1.3 5.3 0 7 0 L29 0 C30.7 0 32 1.3 32 3 L32 29 C32 31.2 30.2 33 28 33 L28 36 C28 37.1 27.1 38 26 38 L24 38 C22.9 38 22 37.1 22 36 L22 33 L14 33 L14 36 C14 37.1 13.1 38 12 38 L10 38 C8.9 38 8 37.1 8 36 L8 33 L8 33 C5.8 33 4 31.2 4 29 Z" fill="#F4B93E"/>
    
    <!-- Letreiro / Visor superior -->
    <rect x="9" y="3" width="18" height="3" rx="1" fill="#12205C"/>
    
    <!-- Para-brisa panorâmico -->
    <rect x="7" y="8" width="22" height="11" rx="2" fill="#0B1437"/>
    <!-- Reflexo no vidro -->
    <path d="M8 9 L15 9 L11 18 L8 18 Z" fill="#FFFFFF" opacity="0.15"/>
    
    <!-- Grade frontal / detalhe -->
    <rect x="13" y="24" width="10" height="3" rx="1.5" fill="#12205C"/>
    
    <!-- Faróis -->
    <circle cx="9" cy="25" r="2.2" fill="#FFFFFF"/>
    <circle cx="27" cy="25" r="2.2" fill="#FFFFFF"/>
    
    <!-- Para-choque / base -->
    <rect x="6" y="29" width="24" height="2" rx="1" fill="#0B1437"/>
  </g>
</svg>
